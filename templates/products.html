{% extends "base.html" %}
{% block content %}
<h2>Inventory</h2>
<form method="post" action="{{ url_for('add_product') }}" class="row">
  <input name="name" placeholder="Product name" required>
  <input name="price" type="number" step="0.01" min="0" placeholder="Price" required>
  <input name="stock" type="number" min="0" placeholder="Stock" required>
  <button>Add product</button>
</form>
<div class="scroll">
<table>
  <tr><th>Name</th><th>Price</th><th>Stock</th><th>Restock</th><th></th></tr>
  {% for p in products %}
  <tr class="{{ 'low' if p.stock <= low }}">
    <td>{{ p.name }}</td>
    <td>{{ "%.2f"|format(p.price) }}</td>
    <td>{{ p.stock }}{% if p.stock <= low %} <span class="tag">Low stock</span>{% endif %}</td>
    <td>
      <form method="post" action="{{ url_for('restock', pid=p.id) }}" class="row">
        <input name="qty" type="number" min="1" value="10" style="width:70px">
        <button>Add</button>
      </form>
    </td>
    <td>
      <form method="post" action="{{ url_for('delete_product', pid=p.id) }}" onsubmit="return confirm('Delete this product?')">
        <button class="danger">Delete</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="5">No products yet. Add one above.</td></tr>
  {% endfor %}
</table>
</div>
{% endblock %}
