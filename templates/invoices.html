{% extends "base.html" %}
{% block content %}
<h2>Invoices</h2>
<div class="scroll">
<table>
  <tr><th>#</th><th>Date</th><th>Total</th></tr>
  {% for i in invoices %}
  <tr><td><a href="{{ url_for('invoice_detail', iid=i.id) }}">INV-{{ i.id }}</a></td><td>{{ i.created_at }}</td><td>{{ "%.2f"|format(i.total) }}</td></tr>
  {% else %}
  <tr><td colspan="3">No invoices yet.</td></tr>
  {% endfor %}
</table>
</div>
{% endblock %}
